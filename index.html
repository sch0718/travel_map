<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 지도</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5cda008d02047bd5e619b759494363c4"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <span class="header__title">여행 지도</span>

      <div class="header__selector">
        <select id="theme-select">
          <option value="">테마/여행 선택</option>
        </select>
      </div>

      <div id="view-mode-selector" class="view-mode" style="display:none;">
        <button id="theme-view-btn" class="view-mode__btn" type="button">테마</button>
        <button id="trip-view-btn" class="view-mode__btn active" type="button">여행</button>
      </div>

      <div class="header__search">
        <iconify-icon icon="mdi:magnify" class="header__search-icon"></iconify-icon>
        <input type="text" id="search-input" placeholder="장소 검색...">
      </div>
      <button id="search-button" style="display:none;"></button>

      <div class="header__spacer"></div>

      <div class="header__actions">
        <button id="settings-button" class="icon-btn" type="button" aria-label="설정">
          <iconify-icon icon="mdi:cog"></iconify-icon>
        </button>
      </div>
    </header>

    <!-- Main -->
    <div class="main">
      <!-- Map -->
      <div class="map-container">
        <div id="map"></div>
      </div>

      <!-- Side Panel -->
      <aside class="side-panel">
        <div id="mobile-panel-handle" class="mobile-handle">
          <div class="mobile-handle__bar"></div>
        </div>

        <div class="side-panel__header">
          <div class="theme-info">
            <h2 id="theme-title" class="side-panel__title">테마를 선택하세요</h2>
            <p id="theme-description" class="side-panel__description"></p>
          </div>
        </div>

        <div id="trip-info-bar" class="trip-info" style="display:none;"></div>

        <div id="day-tabs" class="day-tabs" style="display:none;"></div>

        <div class="category-filter">
          <div id="category-list" class="category-filter__list"></div>
        </div>

        <div class="side-panel__content">
          <h3 id="places-list-title" class="side-panel__title" style="padding:var(--space-sm) var(--space-md);font-size:var(--font-size-sm);">장소 목록</h3>
          <ul id="places" class="place-list"></ul>
        </div>
      </aside>

      <!-- Panel Toggle -->
      <button id="toggle-panel" class="panel-toggle" type="button" aria-label="패널 접기">▶</button>
    </div>

    <!-- Place Info Panel -->
    <div id="place-info-panel" class="place-info">
      <button id="close-place-info" class="place-info__close" type="button" aria-label="닫기">
        <iconify-icon icon="mdi:close"></iconify-icon>
      </button>
      <div class="place-info__header">
        <h3 id="place-title" class="place-info__title"></h3>
        <p id="place-address" class="place-info__address"></p>
      </div>
      <div class="place-info__body">
        <p id="place-description" class="place-info__description"></p>
        <div id="place-labels" class="place-info__labels"></div>
        <div class="place-info__links">
          <a id="naver-map-link" class="place-info__link" href="#" target="_blank" rel="noopener">
            <iconify-icon icon="simple-icons:naver"></iconify-icon> 네이버 지도
          </a>
          <a id="kakao-map-link" class="place-info__link" href="#" target="_blank" rel="noopener">
            <iconify-icon icon="simple-icons:kakaotalk"></iconify-icon> 카카오 지도
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
