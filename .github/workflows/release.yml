# GitHub Actions 워크플로우 - Release
# 태그 생성 시 GitHub Release를 생성하고 릴리스 노트를 파일로 저장

name: Create Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # v1.0.0 형식의 정식 태그만 (운영 배포 기준)

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Release 생성 및 파일 커밋 권한
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # 전체 히스토리 필요 (릴리스 노트 생성용)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리스 노트 생성 및 GitHub Release 생성
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.ref.replace('refs/tags/', '');

            // 릴리스 노트 자동 생성
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName
            });

            // GitHub Release 생성
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `릴리스 ${tagName}`,
              body: notes.body,
              draft: false,
              prerelease: false
            });

            core.setOutput('release_body', notes.body);
            core.setOutput('release_url', release.html_url);
            console.log(`릴리스 생성 완료: ${release.html_url}`);

      - name: 릴리스 노트 파일 저장
        env:
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_BODY: ${{ steps.create_release.outputs.release_body }}
        run: |
          mkdir -p docs/releases

          # 환경변수를 사용하여 안전하게 파일 생성
          {
            echo "# 릴리스 ${TAG_NAME}"
            echo ""
            echo "**배포일:** $(date +%Y-%m-%d)"
            echo "**유형:** 운영 배포"
            echo ""
            echo "---"
            echo ""
            echo "${RELEASE_BODY}"
          } > "docs/releases/${TAG_NAME}.md"

          cp "docs/releases/${TAG_NAME}.md" docs/releases/latest.md

          echo "✅ 릴리스 노트 저장 완료: docs/releases/${TAG_NAME}.md"

      - name: 릴리스 노트 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/releases/

          if git diff --staged --quiet; then
            echo "커밋할 변경사항 없음"
            exit 0
          fi

          git commit -m "docs: ${{ github.ref_name }} 릴리스 노트 추가 [skip ci]"
          git push origin main

          echo "✅ 릴리스 노트를 main 브랜치에 커밋 및 푸시 완료"

      - name: 요약
        run: |
          echo "## 🎉 운영 릴리스 생성 완료" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**태그:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**유형:** 운영 릴리스" >> $GITHUB_STEP_SUMMARY
          echo "**릴리스 노트:** \`docs/releases/${{ github.ref_name }}.md\`에 저장됨" >> $GITHUB_STEP_SUMMARY
          echo "**릴리스 URL:** ${{ steps.create_release.outputs.release_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 후속 작업" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ GitHub Release 생성 완료" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ 릴리스 노트 파일 저장 완료" >> $GITHUB_STEP_SUMMARY
          echo "3. ⏳ 내부 GitLab 동기화 (수동)" >> $GITHUB_STEP_SUMMARY
          echo "4. ⏳ 내부 GitLab CI/CD 자동 실행" >> $GITHUB_STEP_SUMMARY
          echo "5. ⏳ 운영 환경 배포 (수동 승인)" >> $GITHUB_STEP_SUMMARY
